plugins {
    id "fabric-loom" version "1.9-SNAPSHOT"
}
 
version = "fabric-${rootProject.mc_version}-${rootProject.mod_version}"

loom {
    runs {
        client {
            client()
            setConfigName("fabric_client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("fabric_server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }

    mixin {
        defaultRefmapName = "${mod_id}.mixin.refmap.json"
    }
}

repositories {
    maven {
        name "Create Porting Lib"
        url "https://mvn.devos.one/snapshots/"
    }
    maven {
        name "Create Porting Lib"
        url "https://mvn.devos.one/releases/"
    }
    maven {
        name "Forge Config API Port"
        url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name "Reach Entity Attributes"
        url "https://maven.jamieswhiteshirt.com/libs-release/"
    }
}

dependencies {
    // Mod
    minecraft "com.mojang:minecraft:${mc_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${mc_version}:${fabric_parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}+${mc_version}"

    // Ad Astra - Required
    modImplementation "earth.terrarium.common_storage_lib:common-storage-lib-fabric-${mc_version}:${csl_version}"
	modImplementation "curse.maven:ad-astra-635042:${ad_astra_fabric_file}"
    //modImplementation "earth.terrarium.adastra:ad_astra-fabric-${mc_version}:${ad_astra_version}"
    modImplementation "com.teamresourceful.resourcefullib:resourcefullib-fabric-1.21:${resourcefullib_version}"
    modImplementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.21:${resourcefulconfig_version}"

    // Ad Astra - Optional
    modImplementation "dev.architectury:architectury-fabric:${architectury_version}"
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") { exclude(group: "net.fabricmc.fabric-api") }
    modImplementation "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    modImplementation "mezz.jei:jei-${mc_version}-fabric:${jei_version}"

    // Implementation
    //modImplementation "com.simibubi.create:create-fabric-${mc_version}:${create_version}"
    modCompileOnly "curse.maven:trinkets-341284:${trinkets_file}"
    modCompileOnly "blank:cardinal-components-base:${cardinal_components_version}"
    modCompileOnly "blank:cardinal-components-entity:${cardinal_components_version}"

    // Runtiem Only
    modRuntimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
    //modRuntimeOnly "RebornCore:RebornCore-1.21:${techreborn_version}"
    //modRuntimeOnly "TechReborn:TechReborn-1.21:${techreborn_version}"
    modRuntimeOnly "curse.maven:jade-324717:${jade_file}"
}
