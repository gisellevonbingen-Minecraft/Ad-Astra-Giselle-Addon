pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net" }
        maven { url "https://maven.minecraftforge.net" }
        maven { url "https://maven.parchmentmc.org" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.7.0"
}

include("fabric", "forge")
